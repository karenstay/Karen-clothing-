<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nan Thin Kyine Karen Clothing</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fdf8f2; font-family: Georgia, 'Times New Roman', serif; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #c8102e44; border-radius: 4px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const T = {
  en: {
    tagline: "✦ Wholesale Collection ✦",
    shopName: ["Nan Thin Kyine", "Karen Clothing"],
    editOn: "✏️ Edit Products", editOff: "✓ Done Editing",
    paymentLabel: "💳 Payment:",
    catAll: "All",
    cats: { Dresses:"Dresses", Tops:"Tops", Bottoms:"Bottoms", Sets:"Sets", Accessories:"Accessories" },
    contactPrice: "💬 Contact for Price",
    addOrder: "+ Add to Order",
    orderList: "Order List",
    emptyCart: "No items added yet.",
    qty: "Qty", payVia: "💳 Pay via:",
    contactTelegram: "📲 Contact via Telegram",
    placeOrder: "✓ Place Order",
    orderSuccess: "Order Submitted! 🎉",
    successText: "Thank you! Our team will contact you via Telegram to confirm pricing and payment.",
    payAccepted: "Payment accepted:",
    continueShopping: "Continue Shopping",
    editProduct: "Edit Product",
    nameEn: "Product Name (English)", nameMy: "ထုတ်ကုန်အမည် (မြန်မာ)",
    imageUrl: "Image URL", imgPlaceholder: "Paste image URL...",
    orUpload: "— or upload a photo —",
    cancel: "Cancel", save: "Save Changes",
    toastAdded: "Added to order list!", toastSaved: "Product updated!",
    editBtn: "✏️ Edit", msgTelegram: "📲 Message us on Telegram",
  },
  my: {
    tagline: "✦ လက်ကားရောင်းချမှု ✦",
    shopName: ["နန်းသင်းကြည်", "ကရင်အဝတ်အထည်"],
    editOn: "✏️ ထုတ်ကုန် ပြင်ဆင်မည်", editOff: "✓ ပြင်ဆင်မှု ပြီးပါပြီ",
    paymentLabel: "💳 ငွေပေးချေမှု:",
    catAll: "အားလုံး",
    cats: { Dresses:"ဝတ်စုံ", Tops:"အပေါ်ပိုင်း", Bottoms:"အောက်ပိုင်း", Sets:"ဆက်တွဲ", Accessories:"အနုပညာပစ္စည်း" },
    contactPrice: "💬 စျေးနှုန်း မေးရန်",
    addOrder: "+ အော်ဒါ ထည့်မည်",
    orderList: "အော်ဒါစာရင်း",
    emptyCart: "မည်သည့်ပစ္စည်းမှ မထည့်ရသေးပါ။",
    qty: "အရေအတွက်", payVia: "💳 ငွေပေးချေရန်:",
    contactTelegram: "📲 Telegram မှ ဆက်သွယ်ရန်",
    placeOrder: "✓ အော်ဒါ တင်မည်",
    orderSuccess: "အော်ဒါ တင်ပြီးပါပြီ! 🎉",
    successText: "အော်ဒါတင်ပေးသည့်အတွက် ကျေးဇူးတင်ပါသည်။ ကျွန်ုပ်တို့အဖွဲ့သည် Telegram မှတစ်ဆင့် ဆက်သွယ်ပေးပါမည်။",
    payAccepted: "လက်ခံသောငွေပေးချေမှု:",
    continueShopping: "ဆက်လက် ဝယ်ယူမည်",
    editProduct: "ထုတ်ကုန် ပြင်ဆင်ရန်",
    nameEn: "Product Name (English)", nameMy: "ထုတ်ကုန်အမည် (မြန်မာ)",
    imageUrl: "ဓာတ်ပုံ URL", imgPlaceholder: "URL ကူးထည့်ပါ...",
    orUpload: "— သို့မဟုတ် ဓာတ်ပုံ တင်ရန် —",
    cancel: "ပယ်ဖျက်မည်", save: "သိမ်းဆည်းမည်",
    toastAdded: "အော်ဒါစာရင်းထဲ ထည့်ပြီးပါပြီ!", toastSaved: "ထုတ်ကုန် အဆင်ပြေပါပြီ!",
    editBtn: "✏️ ပြင်", msgTelegram: "📲 Telegram မှ စာပို့ရန်",
  }
};

const INIT = [
  { id:1, name:"Karen Traditional Dress - Red Pattern", nameMy:"ကရင်ရိုးရာဝတ်စုံ - အနီရောင်", img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=400&q=80", cat:"Dresses", desc:"Handwoven Karen traditional dress with authentic red & black pattern", descMy:"နီနက်နဲ မဲရောင်ပုံဆင်းဖြင့် လက်ရက်ကရင်ရိုးရာဝတ်စုံ" },
  { id:2, name:"Karen Woven Blouse - Blue", nameMy:"ကရင်ရက်ကန်းအင်္ကျီ - အပြာရောင်", img:"https://images.unsplash.com/photo-1594938298603-c8148c4b4d5a?w=400&q=80", cat:"Tops", desc:"Traditional Karen woven blouse, perfect for daily wear", descMy:"နေ့စဉ်ဝတ်ဆင်ရန် သင့်တော်သောကရင်ရိုးရာရက်ကန်းအင်္ကျီ" },
  { id:3, name:"Karen Longyi - Gold Stripe", nameMy:"ကရင်လုံချည် - ရွှေကြောင်း", img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=400&q=80", cat:"Bottoms", desc:"Elegant Karen-style longyi with gold stripe weaving", descMy:"ရွှေကြောင်းရက်ကန်းဖြင့် သပ်ရပ်သောကရင်ပုံစံလုံချည်" },
  { id:4, name:"Karen Embroidered Top - White", nameMy:"ကရင်အပ်ချုပ်အင်္ကျီ - အဖြူ", img:"https://images.unsplash.com/photo-1551232864-3f0890e580d9?w=400&q=80", cat:"Tops", desc:"White top with intricate Karen embroidery detail", descMy:"ကရင်အပ်ချုပ်ပုံစံများပါဝင်သောအဖြူရောင်အင်္ကျီ" },
  { id:5, name:"Karen Festival Set - Full", nameMy:"ကရင်ပွဲတော်ဝတ်စုံ - အပြည့်", img:"https://images.unsplash.com/photo-1567401893414-76b7b1e5a7a5?w=400&q=80", cat:"Sets", desc:"Complete Karen festival outfit — top, skirt & accessories", descMy:"ကရင်ပွဲတော်ဝတ်စုံ အပြည့်အစုံ — အင်္ကျီ၊ စကတ်နှင့် အပိုပစ္စည်းများ" },
  { id:6, name:"Karen Bag - Handwoven", nameMy:"ကရင်လက်ရက်အိတ်", img:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=400&q=80", cat:"Accessories", desc:"Authentic Karen handwoven shoulder bag with colorful pattern", descMy:"အရောင်စုံပုံဆင်းပါသောစစ်မှန်သောကရင်လက်ရက်တောင်ပိုးအိတ်" },
];

const CAT_KEYS = ["All","Dresses","Tops","Bottoms","Sets","Accessories"];
const TELEGRAM = "https://t.me/hope_1010";

function App() {
  const [lang, setLang] = useState("en");
  const t = T[lang];
  const [products, setProducts] = useState(INIT);
  const [cart, setCart] = useState([]);
  const [cat, setCat] = useState("All");
  const [cartOpen, setCartOpen] = useState(false);
  const [success, setSuccess] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({});
  const [toast, setToast] = useState("");

  const filtered = cat === "All" ? products : products.filter(p => p.cat === cat);
  const totalItems = cart.reduce((s,i) => s+i.qty, 0);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(""), 2500); };

  const addToCart = p => {
    setCart(prev => {
      const ex = prev.find(i=>i.id===p.id);
      if(ex) return prev.map(i=>i.id===p.id?{...i,qty:i.qty+1}:i);
      return [...prev, {...p, qty:1}];
    });
    showToast(t.toastAdded);
  };

  const removeFromCart = id => setCart(prev=>prev.filter(i=>i.id!==id));

  const openEdit = p => { setEditing(p); setForm({name:p.name, nameMy:p.nameMy||"", img:p.img}); };

  const saveEdit = () => {
    setProducts(prev=>prev.map(p=>p.id===editing.id?{...p,name:form.name,nameMy:form.nameMy,img:form.img}:p));
    setEditing(null);
    showToast(t.toastSaved);
  };

  const handleFile = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => setForm(x=>({...x,img:ev.target.result}));
    r.readAsDataURL(f);
  };

  const placeOrder = () => { setSuccess(true); setCart([]); setCartOpen(false); };

  const nm = p => lang==="my"&&p.nameMy ? p.nameMy : p.name;
  const ds = p => lang==="my"&&p.descMy ? p.descMy : p.desc;
  const ct = c => c==="All" ? t.catAll : (t.cats[c]||c);

  return (
    <div style={{minHeight:"100vh",background:"#fdf8f2",fontFamily:"Georgia,serif",color:"#1a1a1a"}}>

      {/* Toast */}
      {toast && (
        <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#1a1a1a",color:"#fff",padding:"10px 22px",borderRadius:20,fontSize:13,zIndex:999,boxShadow:"0 4px 16px rgba(0,0,0,0.25)",whiteSpace:"nowrap"}}>
          {toast}
        </div>
      )}

      {/* HEADER */}
      <header style={{background:"linear-gradient(135deg,#8b0000,#c8102e,#a0001a)",color:"#fff"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"18px 16px 12px",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontSize:11,letterSpacing:3,opacity:.8,marginBottom:5,fontFamily:"sans-serif"}}>{t.tagline}</div>
            <h1 style={{margin:0,fontSize:22,fontWeight:"bold",lineHeight:1.25,textShadow:"0 2px 8px rgba(0,0,0,0.3)"}}>{t.shopName[0]}<br/>{t.shopName[1]}</h1>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginTop:4}}>
            {/* Lang toggle */}
            <div style={{display:"flex",border:"1px solid rgba(255,255,255,0.4)",borderRadius:20,overflow:"hidden"}}>
              {["en","my"].map(l=>(
                <button key={l} onClick={()=>setLang(l)}
                  style={{background:lang===l?"#ffd700":"transparent",color:lang===l?"#8b0000":"rgba(255,255,255,0.8)",border:"none",padding:"5px 11px",fontSize:12,cursor:"pointer",fontWeight:lang===l?"bold":"normal",fontFamily:"sans-serif"}}>
                  {l==="en"?"EN":"မြန်မာ"}
                </button>
              ))}
            </div>
            <button onClick={()=>setEditMode(e=>!e)}
              style={{background:editMode?"#c8102e":"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.4)",color:"#fff",borderRadius:20,padding:"5px 11px",fontSize:12,cursor:"pointer",fontFamily:"sans-serif"}}>
              {editMode ? t.editOff : t.editOn}
            </button>
            <button onClick={()=>setCartOpen(true)}
              style={{background:"rgba(255,255,255,0.2)",border:"1px solid rgba(255,255,255,0.4)",color:"#fff",borderRadius:20,padding:"5px 12px",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
              🛒 <span style={{background:"#ffd700",color:"#8b0000",borderRadius:"50%",width:18,height:18,fontSize:11,display:"inline-flex",alignItems:"center",justifyContent:"center",fontWeight:"bold"}}>{totalItems}</span>
            </button>
          </div>
        </div>
        {/* Payment banner */}
        <div style={{background:"rgba(0,0,0,0.25)",display:"flex",alignItems:"center",gap:8,padding:"7px 16px",fontSize:13,flexWrap:"wrap",fontFamily:"sans-serif"}}>
          <span style={{color:"#ffd700",fontWeight:"bold"}}>{t.paymentLabel}</span>
          {["KPay","KBZ Pay","AYA Pay"].map((m,i,a)=>(
            <span key={m} style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{color:"#fff",background:"rgba(255,255,255,0.15)",padding:"2px 10px",borderRadius:10}}>{m}</span>
              {i<a.length-1 && <span style={{color:"rgba(255,255,255,0.4)"}}>•</span>}
            </span>
          ))}
        </div>
      </header>

      {/* CATEGORIES */}
      <div style={{display:"flex",gap:8,padding:"12px 14px",overflowX:"auto",background:"#fff",borderBottom:"1px solid #eee"}}>
        {CAT_KEYS.map(c=>(
          <button key={c} onClick={()=>setCat(c)}
            style={{background:cat===c?"#c8102e":"#f5ede3",color:cat===c?"#fff":"#5a2d0c",border:"none",borderRadius:20,padding:"6px 14px",fontSize:13,cursor:"pointer",whiteSpace:"nowrap",fontWeight:cat===c?"bold":"normal",fontFamily:"sans-serif"}}>
            {ct(c)}
          </button>
        ))}
      </div>

      {/* PRODUCT GRID */}
      <main style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))",gap:14,padding:14}}>
        {filtered.map(p=>(
          <div key={p.id} style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.08)",display:"flex",flexDirection:"column"}}>
            <div style={{position:"relative",paddingTop:"110%",overflow:"hidden"}}>
              <img src={p.img} alt={nm(p)} style={{position:"absolute",top:0,left:0,width:"100%",height:"100%",objectFit:"cover"}} />
              <div style={{position:"absolute",top:8,left:8,background:"rgba(200,16,46,0.88)",color:"#fff",fontSize:10,padding:"3px 8px",borderRadius:10,fontFamily:"sans-serif"}}>{ct(p.cat)}</div>
              {editMode && (
                <button onClick={()=>openEdit(p)}
                  style={{position:"absolute",bottom:8,right:8,background:"#ffd700",color:"#1a1a1a",border:"none",borderRadius:8,padding:"4px 10px",fontSize:12,cursor:"pointer",fontWeight:"bold",fontFamily:"sans-serif"}}>
                  {t.editBtn}
                </button>
              )}
            </div>
            <div style={{padding:12,flex:1,display:"flex",flexDirection:"column",gap:6}}>
              <h3 style={{margin:0,fontSize:13,fontWeight:"bold",lineHeight:1.3}}>{nm(p)}</h3>
              <p style={{margin:0,fontSize:11,color:"#777",lineHeight:1.4,fontFamily:"sans-serif"}}>{ds(p)}</p>
              <a href={TELEGRAM} target="_blank" rel="noreferrer"
                style={{display:"inline-block",background:"#e8f4fd",color:"#0077b5",padding:"5px 10px",borderRadius:8,fontSize:12,textDecoration:"none",fontFamily:"sans-serif",fontWeight:"bold",marginTop:4}}>
                {t.contactPrice}
              </a>
              <button onClick={()=>addToCart(p)}
                style={{marginTop:"auto",background:"linear-gradient(135deg,#c8102e,#8b0000)",color:"#fff",border:"none",borderRadius:8,padding:"8px",fontSize:13,cursor:"pointer",fontWeight:"bold",fontFamily:"sans-serif"}}>
                {t.addOrder}
              </button>
            </div>
          </div>
        ))}
      </main>

      {/* CART SIDEBAR */}
      {cartOpen && (
        <div onClick={()=>setCartOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:100,display:"flex",justifyContent:"flex-end"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",width:320,maxWidth:"92vw",height:"100vh",overflowY:"auto",padding:20,display:"flex",flexDirection:"column"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <h2 style={{margin:0,fontSize:20,color:"#8b0000"}}>{t.orderList}</h2>
              <button onClick={()=>setCartOpen(false)} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#555"}}>✕</button>
            </div>
            {cart.length===0 ? (
              <p style={{color:"#aaa",textAlign:"center",marginTop:40,fontFamily:"sans-serif"}}>{t.emptyCart}</p>
            ) : (
              <>
                {cart.map(item=>(
                  <div key={item.id} style={{display:"flex",gap:10,alignItems:"center",marginBottom:12,padding:"8px 0",borderBottom:"1px solid #eee"}}>
                    <img src={item.img} alt={nm(item)} style={{width:52,height:52,borderRadius:8,objectFit:"cover"}} />
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:"bold",lineHeight:1.3}}>{nm(item)}</div>
                      <div style={{fontSize:12,color:"#777",fontFamily:"sans-serif",marginTop:2}}>{t.qty}: {item.qty}</div>
                    </div>
                    <button onClick={()=>removeFromCart(item.id)} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:"#c00"}}>✕</button>
                  </div>
                ))}
                <div style={{marginTop:"auto",paddingTop:16,display:"flex",flexDirection:"column",gap:10}}>
                  <div style={{background:"#fdf5e4",borderRadius:8,padding:"8px 12px",fontSize:13,fontFamily:"sans-serif",color:"#5a2d0c"}}>
                    {t.payVia} <strong>KPay · KBZ · AYA</strong>
                  </div>
                  <a href={TELEGRAM} target="_blank" rel="noreferrer"
                    style={{display:"block",textAlign:"center",background:"#0088cc",color:"#fff",padding:"11px",borderRadius:10,textDecoration:"none",fontSize:14,fontWeight:"bold",fontFamily:"sans-serif"}}>
                    {t.contactTelegram}
                  </a>
                  <button onClick={placeOrder}
                    style={{background:"linear-gradient(135deg,#c8102e,#8b0000)",color:"#fff",border:"none",borderRadius:10,padding:"12px",fontSize:15,cursor:"pointer",fontWeight:"bold",fontFamily:"sans-serif"}}>
                    {t.placeOrder}
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* SUCCESS MODAL */}
      {success && (
        <div onClick={()=>setSuccess(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:28,maxWidth:340,width:"90%",display:"flex",flexDirection:"column",gap:12,textAlign:"center"}}>
            <div style={{fontSize:52}}>🎉</div>
            <h2 style={{margin:0,color:"#8b0000",fontSize:22}}>{t.orderSuccess}</h2>
            <p style={{margin:0,color:"#555",fontSize:14,fontFamily:"sans-serif",lineHeight:1.6}}>{t.successText}</p>
            <div style={{background:"#fdf5e4",borderRadius:8,padding:"8px 12px",fontSize:13,fontFamily:"sans-serif",color:"#5a2d0c"}}>
              {t.payAccepted} <strong>KPay · KBZ Pay · AYA Pay</strong>
            </div>
            <a href={TELEGRAM} target="_blank" rel="noreferrer"
              style={{display:"block",textAlign:"center",background:"#0088cc",color:"#fff",padding:"11px",borderRadius:10,textDecoration:"none",fontSize:14,fontWeight:"bold",fontFamily:"sans-serif"}}>
              {t.msgTelegram}
            </a>
            <button onClick={()=>setSuccess(false)}
              style={{background:"linear-gradient(135deg,#c8102e,#8b0000)",color:"#fff",border:"none",borderRadius:10,padding:"12px",fontSize:15,cursor:"pointer",fontWeight:"bold",fontFamily:"sans-serif"}}>
              {t.continueShopping}
            </button>
          </div>
        </div>
      )}

      {/* EDIT MODAL */}
      {editing && (
        <div onClick={()=>setEditing(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:24,maxWidth:380,width:"92%",display:"flex",flexDirection:"column",gap:8,maxHeight:"90vh",overflowY:"auto"}}>
            <h2 style={{margin:"0 0 8px",color:"#8b0000",fontSize:20}}>{t.editProduct}</h2>
            {[["name", t.nameEn], ["nameMy", t.nameMy]].map(([k,label])=>(
              <div key={k}>
                <label style={{fontSize:12,color:"#888",fontFamily:"sans-serif",display:"block",marginBottom:4}}>{label}</label>
                <input value={form[k]||""} onChange={e=>setForm(x=>({...x,[k]:e.target.value}))}
                  style={{border:"1.5px solid #ddd",borderRadius:8,padding:"8px 12px",fontSize:14,fontFamily:"sans-serif",outline:"none",width:"100%"}} />
              </div>
            ))}
            <label style={{fontSize:12,color:"#888",fontFamily:"sans-serif",marginTop:4}}>{t.imageUrl}</label>
            <input value={form.img||""} onChange={e=>setForm(x=>({...x,img:e.target.value}))} placeholder={t.imgPlaceholder}
              style={{border:"1.5px solid #ddd",borderRadius:8,padding:"8px 12px",fontSize:14,fontFamily:"sans-serif",outline:"none",width:"100%"}} />
            <label style={{fontSize:12,color:"#888",fontFamily:"sans-serif",marginTop:4}}>{t.orUpload}</label>
            <input type="file" accept="image/*" onChange={handleFile} style={{fontSize:13,fontFamily:"sans-serif"}} />
            {form.img && <img src={form.img} alt="preview" style={{width:"100%",height:160,objectFit:"cover",borderRadius:10,marginTop:6}} />}
            <div style={{display:"flex",gap:10,marginTop:8}}>
              <button onClick={()=>setEditing(null)}
                style={{flex:1,padding:"10px",border:"1.5px solid #ddd",borderRadius:10,background:"#fff",cursor:"pointer",fontSize:14,fontFamily:"sans-serif"}}>
                {t.cancel}
              </button>
              <button onClick={saveEdit}
                style={{flex:1,padding:"10px",background:"linear-gradient(135deg,#c8102e,#8b0000)",color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontSize:14,fontWeight:"bold",fontFamily:"sans-serif"}}>
                {t.save}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
